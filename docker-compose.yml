version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: nexusml-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexusml
    volumes:
      - mongo-data:/data/db
    networks:
      - nexus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusml-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/nexusml
      JWT_SECRET: nexusml_super_secret_jwt_key_change_in_prod
      JWT_EXPIRE: 7d
      ML_SERVICE_URL: http://ml-service:8000
      BACKEND_URL: http://localhost:5000
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Shared uploads volume — backend writes here, ml-service reads here
      - uploads-data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - nexus-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: nexusml-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      UPLOADS_DIR: /app/uploads
      MODELS_DIR: /app/models
    volumes:
      # Shared uploads — reads dataset files written by backend
      - uploads-data:/app/uploads
      - ml-models:/app/models
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusml-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_ML_SERVICE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - nexus-net

volumes:
  mongo-data:
  ml-models:
  uploads-data:    # Shared between backend and ml-service

networks:
  nexus-net:
    driver: bridge
